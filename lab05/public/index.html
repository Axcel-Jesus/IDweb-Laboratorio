<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de estudiantes</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="student-page">
        <h1>Estudiantes</h1>

        <form id="student-form" class="student-form">
            <label class="visually-hidden" for="student-name">Nombre del estudiante</label>
            <input id="student-name" name="student" type="text" placeholder="Nombre del estudiante" autocomplete="off" required>
            <button type="submit">Agregar</button>
        </form>

        <ul id="student-list" class="student-list" aria-label="Lista de estudiantes"></ul>
    </main>
    <script src="/app.js"></script>
</body>
</html>

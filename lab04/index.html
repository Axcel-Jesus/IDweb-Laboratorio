<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Gestión de Tareas</title>

<!-- Bootstrap 5 -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>


</head>

<body class="bg-light">


<div class="container mt-5">

    <!-- Encabezado -->
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h1 class="h3 mb-0">
                        Gestión de Tareas
                    </h1>
                </div>

                <div class="card-body">

                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                        <button
                            type="button"
                            class="btn btn-primary"
                            data-bs-toggle="modal"
                            data-bs-target="#todo-modal"
                        >
                            Agregar tarea
                        </button>

                        <div class="d-flex align-items-center gap-2">
                            <label for="todo-filter" class="form-label mb-0">Filtrar:</label>
                            <select id="todo-filter" class="form-select" aria-label="Filtrar tareas por estado">
                                <option value="all">Todas</option>
                                <option value="pending">Pendientes</option>
                                <option value="completed">Completadas</option>
                            </select>
                        </div>
                    </div>

                    <!-- Lista de tareas -->
                    <h2 class="h5 mb-3">
                        Lista de tareas
                    </h2>

                    <ul id="todo-list" class="list-group"></ul>

                </div>

                <div class="modal fade" id="todo-modal" tabindex="-1" aria-labelledby="todo-modal-title" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <form id="todo-form" novalidate>
                                <div class="modal-header">
                                    <h2 class="modal-title fs-5" id="todo-modal-title">Nueva tarea</h2>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                                </div>

                                <div class="modal-body">
                                    <div id="todo-alerts" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>

                                    <div class="mb-3">
                                        <label for="todo-title" class="form-label">Título</label>
                                        <input
                                            type="text"
                                            id="todo-title"
                                            class="form-control"
                                            placeholder="Ej. Entregar informe"
                                            autocomplete="off"
                                            required
                                        >
                                    </div>

                                    <div class="mb-3">
                                        <label for="todo-course" class="form-label">Curso</label>
                                        <select id="todo-course" class="form-select" required>
                                            <option value="" selected disabled>Selecciona un curso</option>
                                            <option value="Introducción Web">Introducción Web</option>
                                            <option value="Introducción a la programación">Introducción a la programación</option>
                                            <option value="Cálculo en varias variables">Cálculo en varias variables</option>
                                            <option value="Taller de liderazgo">Taller de liderazgo</option>
                                            <option value="Algoritmos y estructuras de datos">Algoritmos y estructuras de datos</option>
                                            <option value="Bases de datos">Bases de datos</option>
                                            <option value="Redes y comunicación de datos">Redes y comunicación de datos</option>
                                            <option value="Sistemas operativos">Sistemas operativos</option>
                                            <option value="Ingeniería de software">Ingeniería de software</option>
                                            <option value="Arquitectura de computadoras">Arquitectura de computadoras</option>
                                            <option value="Inteligencia artificial">Inteligencia artificial</option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label for="todo-date" class="form-label">Fecha de entrega</label>
                                        <input type="date" id="todo-date" class="form-control" required>
                                    </div>

                                </div>

                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    <button type="submit" class="btn btn-primary">Guardar tarea</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

</div>

<!-- JavaScript de la aplicación -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>


</body>
</html>
